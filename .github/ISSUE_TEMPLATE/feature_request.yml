name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Triton version, framework on top (vLLM, PyTorch Inductor, ...), how caches are deployed.
